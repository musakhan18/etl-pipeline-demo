[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "etl-pipeline-demo"
version = "0.1.0"
description = "Example ETL pipeline with automated tests (Excel -> SQLite)"
authors = [{name="Your Name"}]
dependencies = [
    "pandas>=2.1.0",
    "openpyxl>=3.1.2",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
addopts = "-q"
